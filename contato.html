<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <link rel="stylesheet" href="css/style.css">
    <header>
        <img src="https://gritorock.com.br/wp-content/uploads/2024/06/20240617-musicas-charlie-brown-jr.jpg" alt="Logo da banda Charlie Brown Jr.">
        <h1>Contato</h1>
        <p>Entre em contato conosco para saber mais sobre o Fan Clube Charlie Brown Jr. e compartilhar suas histórias e experiências com a banda.</p>
     <nav>
      <a href="index.html">Voltar ao Início</a>
    </nav>
</body>
<main>
    <section id="contato">
        <h2>Formulário de Contato</h2>
        <form >
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome"  placeholder="digite seu nome" required>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="digite seu email" required>
        <label for="mensagem">Mensagem:</label>
        <textarea id="mensagem" name="mensagem" placeholder="digite sua mensagem" required></textarea>
        <button type="submit">Enviar</button>
        </form>
    </section>
</html>
